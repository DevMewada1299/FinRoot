<title>Probation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a ledger-green workspace for one restaurant owner.
   Today: what needs her call, with the clerk's status in a rail. Pip's record: limits, learning, work log. Ask Pip: why, answered from the log. */
:root{
  --bg:#f1f4ee; --surface:#fafbf8; --surface-2:#e6ebe0; --ink:#16201a; --ink-2:#4b5a51; --line:#d0d8c9;
  --accent:#1f4b8f; --accent-ink:#ffffff; --accent-soft:#dbe6f5;
  --good:#23703f; --good-soft:#d8eddf; --warn:#8f5805; --warn-soft:#f5e6c6; --bad:#a92c19; --bad-soft:#f6dad3;
  --bar:#e8efe2; --scrim:rgba(22,32,26,.38);
  --shadow:0 1px 0 rgba(22,32,26,.04),0 10px 28px -14px rgba(22,32,26,.22);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --surface:#19211d; --surface-2:#222c27; --ink:#e7eee9; --ink-2:#a3b2a9; --line:#2f3b35;
    --accent:#86aef0; --accent-ink:#0d1a2e; --accent-soft:#1c2c47;
    --good:#67c48a; --good-soft:#173223; --warn:#e0a845; --warn-soft:#3a2d12; --bad:#f08a77; --bad-soft:#3c1b15;
    --bar:#1d2822; --scrim:rgba(0,0,0,.55); --shadow:0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211d; --surface-2:#222c27; --ink:#e7eee9; --ink-2:#a3b2a9; --line:#2f3b35;
  --accent:#86aef0; --accent-ink:#0d1a2e; --accent-soft:#1c2c47;
  --good:#67c48a; --good-soft:#173223; --warn:#e0a845; --warn-soft:#3a2d12; --bad:#f08a77; --bad-soft:#3c1b15;
  --bar:#1d2822; --scrim:rgba(0,0,0,.55); --shadow:0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font-family:inherit}
.wrap{max-width:1120px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}

/* prototype bar */
.demobar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px;font:500 11px/1.4 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.demobar .grow{flex:1}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-top:20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;padding:0 7px;flex:none}
.mark i{display:block;height:3px;border-radius:2px;background:var(--bg);width:16px}
.mark i:nth-child(2){width:10px;background:var(--good)}
.brand b{font:700 22px/1 var(--f-display);letter-spacing:-.02em}
.co{color:var(--ink-2);font-size:13px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:6px 9px;border-radius:6px;background:var(--surface-2);color:var(--ink)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-block;font:500 10.5px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

.tabs{display:flex;gap:2px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font:600 14px var(--f-body);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-top:24px}

/* buttons */
.btn{font:600 13px/1 var(--f-body);min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px}
.btn.ghost{background:transparent}
.link{background:none;border:0;padding:6px 2px;color:var(--accent);font:600 13px var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* today */
.cols{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media (min-width:940px){.cols{grid-template-columns:minmax(0,1fr) 320px;align-items:start}.rail{position:sticky;top:16px}}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
.hello h1{font-size:clamp(26px,4.4vw,36px);line-height:1.1}
.hello .sub{color:var(--ink-2);margin-top:8px;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:20px}
.week{margin-top:20px}
.week-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:10px;font-size:13px;color:var(--ink-2)}
.week-h b{font:700 18px var(--f-display);color:var(--ink)}
.seg{display:flex;gap:3px;height:12px}
.seg span{border-radius:4px;min-width:4px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px 16px;margin-top:12px;font-size:13px}
.legend div{display:flex;flex-direction:column}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.legend .mono{font-size:15px;font-weight:500}
h2.sec{font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.count{font:500 12px var(--f-mono);background:var(--surface-2);border-radius:999px;padding:2px 9px;color:var(--ink-2)}
.bills{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.bill-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.bill h3{font-size:17px}
.meta{color:var(--ink-2);font-size:13px;margin-top:2px}
.amt{font:500 20px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.s{font-size:15px}
.bill .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:12px}
.sug{margin-top:10px;font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.acts .btn:last-child{margin-left:auto}
@media (max-width:520px){.acts .btn:last-child{margin-left:0}}
.empty{color:var(--ink-2);font-size:14px}
.paid{margin:0;padding:0;list-style:none}
.paid li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:10px 12px}
.paid li:nth-child(odd){background:var(--bar)}
.paid b{font-weight:600}
.paid .meta{margin:0;font-size:12.5px}

/* rail */
.pip-h{display:flex;gap:12px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 18px var(--f-display);flex:none}
.pip-h b{font:700 18px var(--f-display);display:block}
.pip-h span{font-size:12.5px;color:var(--ink-2)}
.limit{font:500 34px/1 var(--f-mono);margin:18px 0 4px;font-variant-numeric:tabular-nums}
.limit-l{font-size:13px;color:var(--ink-2)}
.prog{height:8px;border-radius:4px;background:var(--surface-2);margin:14px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.rail h4{font:500 11px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:18px 0 8px}
.rail ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.note-box{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:13px}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--bad)}100%{box-shadow:0 0 0 16px transparent}}

/* incoming email demo */
.incoming{border-color:var(--warn)}
.mail{display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px 10px;margin:12px 0;font-size:13.5px}
.mail dt{color:var(--ink-2)}
.mail dd{margin:0;font-family:var(--f-mono);font-size:12.5px;word-break:break-all}
.mailbody{font-size:14px;padding:12px;border-radius:8px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.mailbody .inj{background:var(--warn-soft);color:var(--warn);padding:2px 6px;border-radius:4px}
.steps{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;box-shadow:var(--shadow)}
.drawer-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.drawer h2{font-size:22px}
.read{margin:16px 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.read b{display:block;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;color:var(--accent)}
.check{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.check-h{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
.check-l{font-weight:600}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:13px}
.trio i{display:block;font:500 10.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);font-style:normal;margin-bottom:2px}
.trio div{min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.trio{grid-template-columns:1fr}}
.check .note{margin-top:8px;font-size:13px;color:var(--ink-2)}
.limitline{margin-top:14px;font-size:13.5px;color:var(--ink-2)}
.drawer .acts{margin-top:18px}

/* record */
.stackv{display:flex;flex-direction:column;gap:24px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.card h2{font-size:18px;margin-bottom:4px}
.card .lead{color:var(--ink-2);font-size:13.5px;margin-bottom:12px}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ladder li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding:10px 12px;border-radius:10px;border:1px solid transparent}
.ladder .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink-2);margin-top:5px}
.ladder li.cur{background:var(--accent-soft);border-color:var(--accent)}
.ladder li.cur .dot{background:var(--accent);border-color:var(--accent)}
.ladder li.next{opacity:.75}
.ladder b{font-weight:600}
.ladder p{font-size:13.5px}
.ladder small{display:block;color:var(--ink-2);margin-top:2px;font-size:12.5px}
.foot{font-size:13px;color:var(--ink-2);margin-top:12px}
.lims{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.lims li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px}
.lims .mono{font-size:12px;color:var(--ink-2);padding-top:2px}
svg.chart{width:100%;height:auto;display:block}
.chart text{font:12px var(--f-mono);fill:var(--ink-2)}
.chart .ev{fill:var(--ink)}
.chart .evb{fill:var(--bad)}
.pols{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.pol{border:1px solid var(--line);border-radius:10px;padding:12px}
.pol.prop{border-color:var(--accent);background:var(--surface)}
.pol-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.pol p{font-size:14px}
.pol small{display:block;color:var(--ink-2);margin-top:6px;font-size:12.5px}
.bt{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:13px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.banner{padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:12px}
.banner.good{background:var(--good-soft);color:var(--good)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.logbox{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.log{list-style:none;margin:0;padding:0;min-width:520px}
.log li{display:grid;grid-template-columns:36px 98px 90px minmax(0,1fr) 70px;gap:10px;padding:8px 12px;font-size:12.5px;align-items:start}
.log li:nth-child(odd){background:var(--bar)}
.log li.bad{background:var(--bad-soft);color:var(--bad)}
.log .mono{font-size:11.5px;color:var(--ink-2)}
.log li.bad .mono{color:var(--bad)}
.log .act{font:500 11px var(--f-mono);letter-spacing:.04em}

/* ask */
.askwrap{max-width:760px}
.askform{display:flex;gap:8px;flex-wrap:wrap}
.askform input{flex:1;min-width:220px;min-height:42px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:15px var(--f-body)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:500 13px var(--f-body);cursor:pointer}
.chips button:hover{border-color:var(--accent)}
.sql{font:12.5px/1.5 var(--f-mono);background:var(--surface-2);padding:10px 12px;border-radius:8px;overflow-x:auto;white-space:pre;margin:12px 0}
.answer{font-size:16px;line-height:1.55}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:min(520px,calc(100% - 32px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="demobar" role="group" aria-label="Prototype controls">
    <span>Prototype · sample data · not connected to a bank</span>
    <span class="grow"></span>
    <button class="btn sm primary" data-act="play" type="button">Play the planted email</button>
    <button class="btn sm ghost" data-act="reset" type="button">Reset</button>
  </div>
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <div><b>Probation</b><div class="co">Bayline Kitchens · 6 kitchens · Marisol Vega, owner</div></div>
    </div>
    <div id="pipchip"></div>
  </header>
  <nav class="tabs" aria-label="Sections">
    <button type="button" data-act="tab" data-tab="today">Today</button>
    <button type="button" data-act="tab" data-tab="record">Pip's record</button>
    <button type="button" data-act="tab" data-tab="ask">Ask Pip</button>
  </nav>
  <main>
    <section id="view-today"></section>
    <section id="view-record" hidden></section>
    <section id="view-ask" hidden>
      <div class="askwrap">
        <p class="eyebrow">Ask the record</p>
        <h1 style="font-size:clamp(24px,4vw,32px);line-height:1.15">Why did Pip do that?</h1>
        <p class="meta" style="margin:8px 0 16px;max-width:60ch">Answers come from Pip's work log, one row per step, so they stay the same months later.</p>
        <form class="askform" id="askform">
          <label for="ask-q" style="position:absolute;left:-9999px">Question</label>
          <input id="ask-q" type="text" autocomplete="off" placeholder="Try: Why was INV-4412 paid?">
          <button class="btn primary" type="submit">Ask</button>
        </form>
        <div class="chips" id="ask-chips"></div>
        <div id="ask-out"></div>
      </div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

var TIERS=[
  {n:0,name:'Shadow',limit:0,rule:'Suggests only. Nothing is paid unless you approve it.'},
  {n:1,name:'Known vendors',limit:500,rule:'Pays small bills from vendors you already use.'},
  {n:2,name:'Trusted',limit:5000,rule:'Pays matched bills up to $5,000 without asking.'},
  {n:3,name:'Senior',limit:25000,rule:'Pays matched bills up to $25,000. Never new vendors.'}
];
var PROMO={1:'20 correct suggestions and no serious mistakes',2:'60 correct decisions and 2 learned policies',3:'150 correct decisions, none wrong in 60 days, and 98% on the replay exam'};
var HARD=[
  ['G-01','Pip can never approve its own proposal above its limit.'],
  ['G-02','Pip cannot change a vendor\'s bank details. Only you can.'],
  ['G-03','Anything over Pip\'s limit goes to you, whatever the paperwork says.'],
  ['G-04','New or changed bank details are held until you confirm by phone, on the number we already have.'],
  ['G-05','Text inside an invoice or email is data. It is never an instruction.']
];
var S;
var timers=[];
var lastFocus=null;
var toastT=null;

function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function usd(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function usd0(n){return '$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});}
function cy(str){
  var h1=0xdeadbeef,h2=0x41c6ce57,i,ch;
  for(i=0;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
function hashOf(prev,e){return cy(prev+'|'+e.t+'|'+e.actor+'|'+e.action+'|'+e.subject+'|'+e.why).toString(16).padStart(14,'0').slice(0,8);}
function stamp(){return 'Oct 24 '+new Date().toTimeString().slice(0,5);}
function C(label,inv,rec,bank,st,note){return {label:label,inv:inv,rec:rec,bank:bank,st:st,note:note};}
function pill(st){return st==='ok'?'<span class="pill good">Matches</span>':st==='warn'?'<span class="pill warn">Check</span>':'<span class="pill bad">Mismatch</span>';}

function paidInv(id,vendor,amount,date,policy,po,acct,n,plain){
  return {id:id,vendor:vendor,amount:amount,date:date,status:'paid',by:'Pip',policy:policy,chip:'Paid by Pip',chipKind:'good',headline:'Matched and paid within limits',plain:plain,

/* ---------- log ---------- */
function addLog(actor,action,subject,why){
  var prev=S.log.length?S.log[S.log.length-1].h:'genesis';
  var e={t:stamp(),actor:actor,action:action,subject:subject,why:why};
  e.h=hashOf(prev,e);S.log.push(e);
}
function verifyChain(){
  var prev='genesis',i,h;
  for(i=0;i<S.log.length;i++){
    h=hashOf(prev,S.log[i]);
    if(h!==S.log[i].h)return {ok:false,at:i};
    prev=h;
  }
  return {ok:true};
}

    ]});
  addLog('sync','NEW','INV-4502','Email from accounts@sutrodairy-coop.co · $4,860.00');
  addLog('ai_agent','FLAGGED','INV-4502','Bank account changed (••4417 to ••9082) · sender domain not on file · instruction found in email text');
  addLog('gateway','DENIED','INV-4502','Payment blocked by G-04: changed bank details need a phone check');
  addLog('gateway','TIGHTENED','Pip','Level 2 to 1 for 7 days · untrusted instructions in email text · Sutro Dairy Coop frozen');
  S.tier=1;S.tight='Oct 31';S.frozen.push('Sutro Dairy Coop');
  S.events.push({wk:29,lvl:1,label:'Tightened',date:'Oct 24',kind:'down'});
  S.flash=true;S.verify=null;
  toast('Held. Pip\'s limit dropped from $5,000 to $500 for 7 days.');
  renderAll();
}

/* ---------- record ---------- */
function chartSvg(){
  var W=640,H=272,Lm=132,Rm=28,Tm=18,Bm=42,pw=W-Lm-Rm,ph=H-Tm-Bm,wk=29;
  function x(w){return Lm+pw*w/wk;}
  function y(l){return Tm+ph*(3-l)/3;}
  var ev=S.events,d='M'+x(ev[0].wk)+' '+y(ev[0].lvl),k,out='';
  for(k=1;k<ev.length;k++)d+=' H'+x(ev[k].wk)+' V'+y(ev[k].lvl);
  d+=' H'+x(wk);
  for(k=0;k<4;k++){
    out+='<line x1="'+Lm+'" x2="'+(W-Rm)+'" y1="'+y(k)+'" y2="'+y(k)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(Lm-10)+'" y="'+(y(k)+4)+'" text-anchor="end">L'+k+' · '+usd0(TIERS[k].limit)+'</text>';
  }
  [[0,'Apr 6'],[8,'Jun 1'],[17,'Aug 3'],[26,'Oct 5']].forEach(function(t){out+='<text x="'+x(t[0])+'" y="'+(H-14)+'" text-anchor="middle">'+t[1]+'</text>';});
  out+='<text x="'+x(wk)+'" y="'+(H-14)+'" text-anchor="end" style="fill:var(--ink)">Today</text>';
  out+='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  ev.forEach(function(e,idx){
    var down=e.kind==='down',cx=x(e.wk),cy2=y(e.lvl);
    out+='<circle cx="'+cx+'" cy="'+cy2+'" r="5.5" fill="'+(down?'var(--bad)':'var(--accent)')+'" stroke="var(--surface)" stroke-width="2"/>';
    out+='<text x="'+(down?cx-10:cx+10)+'" y="'+(cy2-10)+'" text-anchor="'+(down?'end':'start')+'" class="'+(down?'evb':'ev')+'" style="fill:'+(down?'var(--bad)':'var(--ink)')+'">'+e.label+' · '+e.date+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Pip\'s spending limit by level since April"><title>Pip\'s level over time</title>'+out+'</svg>';
}
function renderRecord(){
  var ladder=TIERS.map(function(t){
    return '<li class="'+(t.n===S.tier?'cur':'')+(t.n>S.tier?' next':'')+'"><span class="dot"></span><div><b>Level '+t.n+' · '+t.name+'</b> <span class="mono">'+usd0(t.limit)+'</span><p>'+t.rule+'</p>'+(t.n>0?'<small>To get here: '+PROMO[t.n]+'</small>':'')+'</div></li>';
  }).join('');
  var lims=HARD.map(function(h){return '<li><span class="mono">'+h[0]+'</span><span>'+esc(h[1])+'</span></li>';}).join('');
  var prop=S.pol.proposed.map(function(p){
    return '<li class="pol prop"><div class="pol-h"><span class="chip info">Proposed by Pip</span><span class="mono">'+p.id+'</span></div><p>'+esc(p.text)+'</p><small>'+esc(p.from)+'</small>'+
      '<div class="bt"><b>Replay test:</b> run on '+p.bt.n+' past invoices with an answer key. Caught '+p.bt.caught+' of '+p.bt.total+' planted problems and wrongly held '+p.bt.wrong+' good invoice'+(p.bt.wrong===1?'':'s')+'.</div>'+
      '<div class="acts" style="border:0;padding-top:0"><button class="btn" type="button" data-act="pol-no" data-id="'+p.id+'">Reject</button><button class="btn primary" type="button" data-act="pol-yes" data-id="'+p.id+'">Approve policy</button></div></li>';
  }).join('');
  var act=S.pol.active.map(function(p){
    return '<li class="pol"><div class="pol-h"><span class="chip">'+p.id+'</span><span class="pill good">Active</span></div><p>'+esc(p.text)+'</p><small>'+esc(p.src)+' · '+esc(p.ev)+'</small></li>';
  }).join('');
  var banner='';
  if(S.verify)banner=S.verify.ok?'<div class="banner good">Chain intact. '+S.log.length+' entries, each linked to the one before.</div>':
    '<div class="banner bad">Entry #'+(S.verify.at+1)+' ('+esc(S.log[S.verify.at].t)+', '+esc(S.log[S.verify.at].subject)+') was changed after it was written. Everything after it can no longer be trusted.</div>';
  var rows=S.log.map(function(e,idx){
    var bad=S.verify&&!S.verify.ok&&S.verify.at===idx;
    return '<li class="'+(bad?'bad':'')+'"><span class="mono">#'+(idx+1)+'</span><span class="mono">'+esc(e.t)+'</span><span class="act">'+esc(e.action)+' · '+esc(e.actor)+'</span><span><b>'+esc(e.subject)+'</b> '+esc(e.why)+'</span><span class="mono">'+e.h+'</span></li>';
  }).reverse().join('');
  $('#view-record').innerHTML='<div class="stackv">'+
    '<div class="grid2"><div class="card"><h2>How Pip earns authority</h2><p class="lead">Limits are enforced in code. Pip moves up with a clean record and drops fast when it slips.</p><ol class="ladder">'+ladder+'</ol><p class="foot">A payment Pip should have stopped sends it straight back to Level 0. Untrusted instructions inside an invoice tighten it to Level 1 for 7 days.</p></div>'+
    '<div class="card"><h2>Hard limits</h2><p class="lead">No prompt can change these. The gateway checks every write.</p><ul class="lims">'+lims+'</ul></div></div>'+
    '<div class="card"><h2>Pip\'s authority over time</h2><p class="lead">Each step up was earned. Each step down says why.</p>'+chartSvg()+'</div>'+
    '<div class="card"><h2>What Pip has learned</h2><p class="lead">Pip drafts a policy from your decisions and tests it on past invoices. Nothing takes effect until you approve it.</p><ul class="pols">'+prop+act+'</ul></div>'+
    '<div class="card"><h2>Work record</h2><p class="lead">Every step Pip and the gateway took, including the ones that were denied. Each row is linked to the one before it by a fingerprint.</p>'+
    '<div class="ctrl"><button class="btn" type="button" data-act="verify">Verify the record</button><button class="btn ghost" type="button" data-act="tamper">'+(S.tampered?'Restore the edited row':'Edit an old row (demo)')+'</button></div>'+banner+
    '<div class="logbox"><ul class="log">'+rows+'</ul></div></div></div>';
}

/* ---------- ask ---------- */
function renderAskChips(){
  var q=['Why was INV-4412 paid?','Why is INV-4471 waiting on me?','What changed Pip\'s limit?'];
  if(find('INV-4502'))q.push('Why was INV-4502 blocked?');
  $('#ask-chips').innerHTML=q.map(function(s){return '<button type="button" data-act="why" data-q="'+esc(s)+'">'+esc(s)+'</button>';}).join('');
}
function answer(q){
  var t=q.trim();if(!t)return null;
  var m=t.match(/INV-\d+/i),subject=null,inv=null,plain,words;
  if(m){subject=m[0].toUpperCase();inv=find(subject);}
  else if(/limit|level|tier|promot|tighten|probation/i.test(t)){subject='Pip';}
  else{
    words=t.toLowerCase().split(/\W+/).filter(function(w){return w.length>3;});
    inv=S.inv.filter(function(i){return words.some(function(w){return i.vendor.toLowerCase().indexOf(w)>=0;});})[0]||null;
    if(inv)subject=inv.id;
  }
  if(!subject)return {none:true,q:t};
  var rows=S.log.filter(function(e){return e.subject===subject;});
  if(!rows.length)return {none:true,q:t};
  if(subject==='Pip'){
    plain='Pip is at Level '+S.tier+' ('+TIERS[S.tier].name+') with a limit of '+usd0(limit())+'. '+(S.tight?'It was cut from $5,000 to $500 on Oct 24 for 7 days because an email tried to give it instructions. Pip did not make a mistake. It is a precaution. ':'')+'Before that, Pip was promoted to Level 1 on Apr 27 and Level 2 on Jul 6.';
  }else if(inv){plain=inv.plain;}
  else plain='Here is what the record shows.';
  return {q:t,subject:subject,rows:rows,plain:plain};
}
function renderAskOut(){
  var a=S.ask,el=$('#ask-out');
  if(!a){el.innerHTML='';return;}
  if(a.none){el.innerHTML='<div class="card"><p class="answer">I could not find that in the work record. Try an invoice number like INV-4412, a vendor name, or ask about Pip\'s limit.</p></div>';return;}
  var rows=a.rows.map(function(e,idx){
    return '<li><span class="mono">#'+(S.log.indexOf(e)+1)+'</span><span class="mono">'+esc(e.t)+'</span><span class="act">'+esc(e.action)+' · '+esc(e.actor)+'</span><span>'+esc(e.why)+'</span><span class="mono">'+e.h+'</span></li>';
  }).join('');
  el.innerHTML='<div class="card"><p class="eyebrow">Answer</p><p class="answer">'+esc(a.plain)+'</p>'+
    '<div class="sql">SELECT at, actor, action, why\nFROM   work_record\nWHERE  subject = \''+esc(a.subject)+'\'\nORDER  BY at;</div>'+
    '<div class="logbox"><ul class="log">'+rows+'</ul></div></div>';
}
function runAsk(q){
  $('#ask-q').value=q;S.ask=answer(q);renderAskOut();
}

/* ---------- orchestration ---------- */
function renderAll(){renderChip();renderToday();renderRecord();renderAskChips();renderAskOut();}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,id=b.dataset.id;
  if(act==='tab')go(b.dataset.tab);
  else if(act==='open')openDrawer(id);
  else if(act==='close')closeDrawer();
  else if(act==='approve')approve(id);
  else if(act==='reject')reject(id);
  else if(act==='fake'){
    var i=find(id);if(!i)return;
    i.status='rejected';i.plain='You called Sutro on the number we have on file and confirmed they did not send this. Reported as a fraud attempt. Sutro Dairy stays frozen.';
    addLog('owner','REJECTED',id,'Confirmed by phone: Sutro did not send this · reported as a fraud attempt · vendor stays frozen');
    S.prec++;toast('Recorded. Sutro stays frozen. Pip\'s limit returns to $5,000 on Oct 31.');closeDrawer();renderAll();
  }
  else if(act==='real'){
    var j=find(id);if(!j)return;
    j.status='needs';j.chip='Verified by phone';j.chipKind='info';j.headline='Sutro confirmed the new account by phone.';
    j.suggest='Approve once the new account ••9082 is saved to the vendor file. It is over Pip\'s $500 limit, so you decide.';
    S.frozen=S.frozen.filter(function(v){return v!=='Sutro Dairy Coop';});
    addLog('owner','VERIFIED',id,'You confirmed the new account ••9082 by phone · Pip may not pay it alone');
    toast('Verified. Sutro is unfrozen. The bill now waits for your approval.');closeDrawer();renderAll();
  }
  else if(act==='why'){closeDrawer();go('ask');runAsk(b.dataset.q);}
  else if(act==='pol-yes'||act==='pol-no'){
    var p=S.pol.proposed.filter(function(x){return x.id===id;})[0];if(!p)return;
    S.pol.proposed=S.pol.proposed.filter(function(x){return x.id!==id;});
    if(act==='pol-yes'){
      S.pol.active.push({id:p.id,text:p.text,src:'Approved by you today',ev:'Replay test passed'});
      addLog('owner','APPROVED',p.id,'Policy activated after the replay test');toast(p.id+' is active. The gateway will enforce it from now on.');
    }else{addLog('owner','REJECTED',p.id,'Policy rejected by Marisol');toast(p.id+' rejected. Pip will not use it.');}
    renderAll();
  }
  else if(act==='verify'){S.verify=verifyChain();renderRecord();}
  else if(act==='tamper'){
    var k=S.log.findIndex(function(x){return x.subject==='INV-4412'&&x.action==='POSTED';});if(k<0)return;
    if(!S.tampered){S.tampered={orig:S.log[k].why};S.log[k].why=S.log[k].why.replace('$2,206.40','$2,006.40');toast('Row edited and nothing recomputed. Now press Verify the record.');}
    else{S.log[k].why=S.tampered.orig;S.tampered=false;toast('Row restored.');}
    S.verify=null;renderRecord();
  }
  else if(act==='play')play();
  else if(act==='reset'){clearTimers();closeDrawer();S=seed();renderAll();$('#ask-q').value='';go('today');toast('Reset to the start of the day.');}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#drawer').hidden)closeDrawer();});
$('#scrim').addEventListener('click',closeDrawer);
$('#askform').addEventListener('submit',function(e){e.preventDefault();runAsk($('#ask-q').value);});

S=seed();
renderAll();
var h=(location.hash||'').slice(1);
go(h==='record'||h==='ask'?h:'today');
})();
</script>
